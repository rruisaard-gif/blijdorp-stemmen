<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uitslag · Stem op de beste presentatie</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="qrcode.js"></script>
<style>
  html,body{height:100%;background:var(--groen-donker);color:#fff;overflow:hidden}
  .scherm{position:relative;height:100%;display:grid;grid-template-columns:minmax(300px,38%) 1fr;gap:4vw;align-items:center;padding:4vh 5vw}
  .blad{opacity:.12}
  .qrkaart{position:relative;z-index:1;background:#fff;color:var(--nacht);border-radius:28px;padding:3vh 2vw;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .qrkaart h2{font-size:clamp(20px,2.4vw,34px)}
  #qr{margin:2vh auto;width:min(28vw,52vh);aspect-ratio:1}
  #qr svg,#qr img{width:100%;height:100%;display:block}
  .url{font-weight:800;font-size:clamp(13px,1.3vw,20px);word-break:break-all;color:var(--groen-donker)}
  .rechts{position:relative;z-index:1}
  .rechts .label{display:inline-block;background:rgba(255,255,255,.16);border-radius:9999px;padding:8px 18px;font-weight:700;font-size:clamp(12px,1.1vw,18px);letter-spacing:.05em;text-transform:uppercase}
  .rechts h1{font-size:clamp(34px,5vw,84px);margin-top:2vh;max-width:14ch}
  .teller{margin-top:4vh;display:flex;align-items:baseline;gap:1vw}
  .teller b{font-size:clamp(60px,9vw,150px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
  .teller span{font-size:clamp(18px,2vw,32px);font-weight:700;opacity:.9}
  .dierenrij{display:flex;gap:1.2vw;margin-top:4vh}
  .dierenrij div{width:clamp(48px,6vw,96px)}
  .dierenrij svg{width:100%;height:auto;display:block}
  .onthul{margin-top:5vh;border:0;border-radius:9999px;background:var(--oranje);color:#fff;font-weight:900;font-size:clamp(18px,1.8vw,30px);padding:1.4vh 2.6vw;box-shadow:0 10px 30px rgba(223,82,0,.4)}
  .onthul:hover{transform:translateY(-2px)}

  /* Uitslag */
  .uitslag{position:absolute;inset:0;background:var(--groen-donker);padding:4vh 6vw;display:flex;flex-direction:column;z-index:5}
  .uitslag h1{font-size:clamp(28px,3.6vw,60px)}
  .rijen{margin-top:3vh;display:flex;flex-direction:column;gap:1.6vh;flex:1;justify-content:center}
  .rij{display:grid;grid-template-columns:5vw 8vh 1fr 8vw;align-items:center;gap:1.5vw;opacity:0;transform:translateX(-40px);transition:opacity .6s,transform .6s}
  .rij.zicht{opacity:1;transform:none}
  .rij .plek{font-size:clamp(22px,3vw,52px);font-weight:900;text-align:right;opacity:.85}
  .rij .ico{width:8vh;height:8vh}
  .rij .ico svg{width:100%;height:100%}
  .rij .baan{position:relative;height:8vh;background:rgba(255,255,255,.1);border-radius:9999px;overflow:hidden}
  .rij .vul{position:absolute;inset:0 auto 0 0;width:0;border-radius:9999px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .rij .naam{position:absolute;left:2vw;top:50%;transform:translateY(-50%);font-weight:800;font-size:clamp(14px,1.7vw,28px);white-space:nowrap;text-shadow:0 1px 6px rgba(0,0,0,.35)}
  .rij .aantal{font-size:clamp(22px,2.6vw,46px);font-weight:900;font-variant-numeric:tabular-nums}
  .rij.winnaar .baan{box-shadow:0 0 0 4px #fff}
  .winbanner{position:absolute;inset:0;display:grid;place-items:center;z-index:8;background:rgba(5,29,29,.72);opacity:0;pointer-events:none;transition:opacity .6s}
  .winbanner.zicht{opacity:1;pointer-events:auto}
  .winbanner .doos{background:#fff;color:var(--nacht);border-radius:32px;padding:4vh 4vw;text-align:center;max-width:70vw;transform:scale(.8);transition:transform .6s cubic-bezier(.2,1.4,.4,1)}
  .winbanner.zicht .doos{transform:scale(1)}
  .winbanner svg{width:min(30vh,22vw);height:auto;display:block;margin:0 auto}
  .winbanner .label{display:inline-block;margin-top:2vh;color:#fff;background:var(--oranje);border-radius:9999px;padding:8px 20px;font-weight:800;font-size:clamp(14px,1.4vw,22px);letter-spacing:.06em;text-transform:uppercase}
  .winbanner h2{font-size:clamp(34px,5vw,90px);margin-top:1.5vh}
  .winbanner p{font-size:clamp(16px,1.6vw,28px);font-weight:700;margin-top:1vh}
  .klein{position:absolute;bottom:2vh;right:2vw;z-index:9;display:flex;gap:8px}
  .klein button{background:rgba(255,255,255,.14);border:0;color:#fff;font-weight:700;border-radius:9999px;padding:8px 14px;font-size:13px}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:10}
  .waarschuwing{position:absolute;top:1.5vh;left:50%;transform:translateX(-50%);z-index:20;background:#fde7da;color:#7a2a10;font-weight:700;border-radius:12px;padding:10px 16px;font-size:14px}
</style>
</head>
<body>
<div class="scherm" id="scherm">
  <svg class="blad" style="width:40vh;left:-10vh;bottom:-12vh;transform:rotate(30deg)" viewBox="0 0 100 100"><path d="M50 5 C80 20 90 60 50 95 C10 60 20 20 50 5Z"/></svg>
  <svg class="blad" style="width:28vh;right:-6vh;top:-8vh;transform:rotate(-20deg)" viewBox="0 0 100 100"><path d="M50 5 C80 20 90 60 50 95 C10 60 20 20 50 5Z"/></svg>

  <div class="qrkaart">
    <h2>Scan en stem!</h2>
    <div id="qr"></div>
    <div class="url" id="url"></div>
  </div>

  <div class="rechts">
    <span class="label" id="subtitel"></span>
    <h1 id="titel"></h1>
    <div class="teller"><b id="totaal">0</b><span id="totaal-tekst">stemmen binnen</span></div>
    <div class="dierenrij" id="dierenrij"></div>
    <button class="onthul" id="onthul">Onthul de winnaar 🏆</button>
  </div>
</div>

<div class="uitslag verborgen" id="uitslag">
  <h1>En de uitslag is…</h1>
  <div class="rijen" id="rijen"></div>
</div>

<div class="winbanner" id="winbanner"><div class="doos" id="windoos"></div></div>
<canvas id="confetti"></canvas>
<div class="klein"><button id="terugknop" class="verborgen">← Terug naar QR</button><button id="schermknop">Volledig scherm</button></div>

<script src="config.js"></script>
<script src="animals.js"></script>
<script type="module">
import { volg, demo, geconfigureerd, demoReset } from "./db.js";
const C = window.STEM_CONFIG, SVG = window.DIEREN_SVG;
const $ = id => document.getElementById(id);
$("titel").textContent = C.titel; $("subtitel").textContent = C.subtitel + (demo ? " · DEMO" : "");

// QR-code naar de stempagina (zelfde map)
const stemUrl = new URL("./" + (demo ? "?demo" : ""), location.href).href;
$("url").textContent = stemUrl.replace(/^https?:\/\//, "").replace(/\/$/, "");
try {
  const qr = qrcode(0, "M"); qr.addData(stemUrl); qr.make();
  $("qr").innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
} catch { $("qr").innerHTML = `<p style="padding-top:40%;font-weight:700">QR-code kon niet laden.<br>Gebruik de link hieronder.</p>`; }

$("dierenrij").innerHTML = C.groepen.map(g => `<div title="${g.dier}">${SVG[g.id] || ""}</div>`).join("");

let telling = {}, totaal = 0;
function waarschuw(t){ const d = document.createElement("div"); d.className = "waarschuwing"; d.textContent = t; document.body.appendChild(d); }
if (!demo && !geconfigureerd) waarschuw("Nog niet gekoppeld aan Firebase: vul config.js in, of open met ?demo om te testen.");
else volg((t, n) => {
  telling = t; totaal = n;
  $("totaal").textContent = n; $("totaal-tekst").textContent = n === 1 ? "stem binnen" : "stemmen binnen";
}, () => waarschuw("Kan de stemmen niet ophalen. Controleer de Firebase-regels en de internetverbinding."));

// Onthullen: van de laatste plek naar de winnaar
let bezig = false;
async function onthul(){
  if (bezig) return; bezig = true;
  const lijst = C.groepen.map(g => ({ ...g, n: telling[g.id] || 0 })).sort((a, b) => b.n - a.n);
  let plek = 0, vorige = null;
  lijst.forEach((g, i) => { if (g.n !== vorige) { plek = i + 1; vorige = g.n; } g.plek = plek; });
  const max = Math.max(1, ...lijst.map(g => g.n));
  const rijen = $("rijen"); rijen.innerHTML = "";
  lijst.forEach(g => {
    const r = document.createElement("div"); r.className = "rij" + (g.plek === 1 && g.n > 0 ? " winnaar" : "");
    r.innerHTML = `<div class="plek">${g.plek}</div><div class="ico">${SVG[g.id] || ""}</div>
      <div class="baan"><div class="vul" style="background:${g.kleur}"></div><div class="naam"></div></div><div class="aantal">0</div>`;
    r.querySelector(".naam").textContent = `${g.groep} · ${g.dier}`;
    r.dataset.n = g.n; r.dataset.w = (g.n / max * 100).toFixed(1);
    rijen.appendChild(r);
  });
  $("uitslag").classList.remove("verborgen"); $("terugknop").classList.remove("verborgen");
  const els = [...rijen.children].reverse();
  for (const r of els) {
    await wacht(r === els[els.length - 1] ? 2200 : 1300);
    r.classList.add("zicht");
    await wacht(250);
    r.querySelector(".vul").style.width = r.dataset.w + "%";
    telOp(r.querySelector(".aantal"), +r.dataset.n);
  }
  const winnaars = lijst.filter(g => g.plek === 1 && g.n > 0);
  await wacht(1600);
  if (winnaars.length) toonWinnaar(winnaars);
  bezig = false;
}
const wacht = ms => new Promise(r => setTimeout(r, ms));
function telOp(el, doel){ const start = performance.now(); const stap = t => { const p = Math.min(1, (t - start) / 1100); el.textContent = Math.round(doel * p); if (p < 1) requestAnimationFrame(stap); }; requestAnimationFrame(stap); }

function toonWinnaar(w){
  const d = $("windoos");
  const gelijk = w.length > 1;
  d.innerHTML = `<div style="display:flex;justify-content:center;gap:2vw">${w.map(g => `<div>${SVG[g.id] || ""}</div>`).join("")}</div>
    <span class="label">${gelijk ? "Gedeelde winnaars" : "Winnaar"}</span><h2></h2><p></p>`;
  d.querySelector("h2").textContent = w.map(g => g.dier).join(" & ");
  d.querySelector("p").textContent = w.map(g => g.groep).join(" & ") + ` · ${w[0].n} ${w[0].n === 1 ? "stem" : "stemmen"}`;
  $("winbanner").classList.add("zicht");
  confetti();
}
$("winbanner").onclick = () => $("winbanner").classList.remove("zicht");
$("onthul").onclick = onthul;
$("terugknop").onclick = () => { $("uitslag").classList.add("verborgen"); $("winbanner").classList.remove("zicht"); $("terugknop").classList.add("verborgen"); };
$("schermknop").onclick = () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(); };
document.addEventListener("keydown", e => {
  if ((e.key === " " || e.key === "Enter") && $("uitslag").classList.contains("verborgen")) { e.preventDefault(); onthul(); }
  if (demo && e.key === "r") { demoReset(); }
});

function confetti(){
  const c = $("confetti"), x = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const kl = ["#33AF6D", "#DF5200", "#0072BD", "#E8A33D", "#ffffff", "#EAF7F0"];
  const p = Array.from({ length: 220 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .6, r: 4 + Math.random() * 6, vy: 2 + Math.random() * 4, vx: -1.5 + Math.random() * 3, a: Math.random() * 6, va: -.15 + Math.random() * .3, k: kl[Math.random() * kl.length | 0] }));
  const eind = performance.now() + 6000;
  (function teken(t){
    x.clearRect(0, 0, c.width, c.height);
    p.forEach(q => { q.x += q.vx; q.y += q.vy; q.a += q.va; x.save(); x.translate(q.x, q.y); x.rotate(q.a); x.fillStyle = q.k; x.fillRect(-q.r / 2, -q.r / 4, q.r, q.r / 2); x.restore(); });
    if (t < eind) requestAnimationFrame(teken); else x.clearRect(0, 0, c.width, c.height);
  })(performance.now());
}
</script>
</body>
</html>
